name: NexusCorp
options:
  bundleIdPrefix: com.allthingschucks
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"

targets:
  NexusCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NexusCore
    settings:
      PRODUCT_NAME: NexusCore
      PRODUCT_BUNDLE_IDENTIFIER: com.allthingschucks.NexusCore
      GENERATE_INFOPLIST_FILE: YES
      DYLIB_INSTALL_NAME_BASE: "@rpath"
      SKIP_INSTALL: YES
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "YES"
      LD_RUNPATH_SEARCH_PATHS:
        - "$(inherited)"
        - "@executable_path/../Frameworks"
        - "@loader_path/Frameworks"

  NexusCorp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NexusApp
    dependencies:
      - target: NexusCore
        embed: true
    settings:
      PRODUCT_NAME: NexusCorp
      PRODUCT_BUNDLE_IDENTIFIER: com.allthingschucks.NexusCorp
      INFOPLIST_FILE: NexusApp/Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: NexusApp/Resources/NexusCorp.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ENABLE_HARDENED_RUNTIME: YES
      COMBINE_HIDPI_IMAGES: YES
      LD_RUNPATH_SEARCH_PATHS:
        - "$(inherited)"
        - "@executable_path/../Frameworks"

  NexusAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: NexusAppTests
    dependencies:
      - target: NexusCore
    settings:
      PRODUCT_NAME: NexusAppTests
      PRODUCT_BUNDLE_IDENTIFIER: com.allthingschucks.NexusAppTests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: ""
      BUNDLE_LOADER: ""
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "YES"

schemes:
  NexusCorp:
    build:
      targets:
        NexusCorp: all
        NexusCore: all
        NexusAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NexusAppTests
