services:
  - type: web
    name: nexuscorp
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: MODE
        value: paper
      - key: LIVE_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.6
